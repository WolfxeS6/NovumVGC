 SCA_giant_awake: "The Northern Giant"
 SCA_giant_awake_desc: "Through decades of institutional reform, regional investment and economic integration, the Nordic Federation has transformed itself into one of the world's most prosperous, innovative and cohesive societies. What began as an ambitious political experiment has become a model of federal governance and sustainable development."
 SCA_nordic_neutrality: "Nordic Neutrality"
 SCA_nordic_neutrality_desc: "The Nordic Federation was founded through negotiation rather than conquest. Its citizens broadly support a strong territorial defence and an independent foreign policy, but expects its government to uphold the principles of neutrality, diplomacy and international cooperation whenever possible."

