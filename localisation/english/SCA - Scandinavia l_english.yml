### Decisions ###
 SCA_economic_development_decisions: "Develop the Federation"
 SCA_economic_development_decisions_desc: "A strong economy should be developed in order to further integrate the Nordic countries into a single entity. New factories and plants will create more jobs and accelerate urbanisation throughout the Federation."
