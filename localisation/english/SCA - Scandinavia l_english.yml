### Focus Tree ###
### Formation
 SCANDINAVIA_nordic_council: "Militarize the Nordic Council"
 SCANDINAVIA_nordic_council_desc: "The Nordic Council already provides a platform for parliamentary cooperation. By expanding its authority and scope, we can transform it into the central institution of Nordic political coordination."
 SCANDINAVIA_defense_coordination: "Nordic Defense Coordination"
 SCANDINAVIA_defense_coordination_desc: "Nordic defence cooperation already exists, but its scope is limited. Expanding it into a true coordinated defense structure would dramatically strengthen regional security."
 SCANDINAVIA_procurement_command: "Joint Procurement Command"
 SCANDINAVIA_procurement_command_desc: "Pooling procurement efforts across the Nordic states will allow us to negotiate better contracts and standardize equipment across our armed forces."
 SCANDINAVIA_officer_exchange: "Nordic Officer Exchange"
 SCANDINAVIA_officer_exchange_desc: "The increased cooperation between the Nordic armies requires officers with a special mind-set and certain skills. Let us exchange generals to further aid in this."
 SCANDINAVIA_passport_union: "Expand the Nordic Passport Union"
 SCANDINAVIA_passport_union_desc: "Free movement between the Nordic countries has long existed, but we can further harmonize residency, employment, and social rights across borders."
 SCANDINAVIA_joint_committees: "Joint Parliamentary Committees"
 SCANDINAVIA_joint_committees_desc: "Regular joint committees between Nordic legislatures will allow the harmonization of legislation and prepare the groundwork for deeper integration."
 SCANDINAVIA_development_fund: "Nordic Development Fund"
 SCANDINAVIA_development_fund_desc: "A shared Nordic investment fund would allow us to coordinate large-scale infrastructure and industrial projects across Scandinavia."
 SCANDINAVIA_monetary_coordination: "Nordic Monetary Coordination"
 SCANDINAVIA_monetary_coordination_desc: "From 1873 to 1914 Scandinavia shared a currency. While it is still early to create a single currency, we can coordinate our monetary policies."
 SCANDINAVIA_expand_sas: "Expand Scandinavian Airlines"
 SCANDINAVIA_expand_sas_desc: "Scandinavian Airlines already symbolizes Nordic cooperation. Expanding it as a strategic transport and logistics provider could strengthen regional integration."
 SCANDINAVIA_single_market: "Nordic Single Market"
 SCANDINAVIA_single_market_desc: "By eliminating remaining regulatory and trade barriers, we can create a truly unified Nordic economic zone."
 SCANDINAVIA_research_forum: "Nordic Research Forum"
 SCANDINAVIA_research_forum_desc: "Nordic universities and research institutions are already closely connected. Formalizing their cooperation could greatly accelerate technological development."
 SCANDINAVIA_innovation_network: "Nordic Innovation Network"
 SCANDINAVIA_innovation_network_desc: "The success of the Nordic Research Forum means that we could increase our cooperation further. If we institute a fixed system for sharing knowledge, we would all benefit in the long run."
 SCANDINAVIA_proclaim_nordic_federation: "Proclaim the Nordic Federation"
 SCANDINAVIA_proclaim_nordic_federation_desc: "Decades of cooperation have brought the Nordic countries closer than ever before. With our institutions aligned and our economies integrated, the time has come to formalize our unity in a single Nordic Federation."

### Political
 SCA_begin_negotiations: "Ensuring Our Neutrality!"
 SCA_begin_negotiations_desc: "One of the core ideals in the formation of our federation was of peace. We will abandon needless wars and to ensure that, we must begin negotiations with our powerful neighbours to ensure war never comes to our doors."
 SCA_Nordic_Constitution: "The Nordic Constitution"
 SCA_Nordic_Constitution_desc: "With the creation of a unified Nordic state, it is paramount that a constitution shall be adopted that counts for all the member states of the federation, emphasising the strength of the federal government."
 SCA_The_First_Nordic_Elections: "The First Nordic Elections"
 SCA_The_First_Nordic_Elections_desc: "With the constitution properly established, it is time for NTC, mostly made up of civil servants, to transfer power to an elected federal government. To this end, the first pan-Nordic elections will have to be organised."
 SCA_Socialdemocratic_government: "Appoint a Social Democratic Government"
 SCA_Socialdemocratic_government_desc: "The NSP promises to build and maintain unified Nordic welfare state, one that will be a shining example for the rest of the world to follow. We should appoint their people to our government."
 SCA_welfare_state: "Build the Welfare State"
 SCA_welfare_state_desc: "Economic prosperity must be matched by social security. By strengthening the Federation's welfare institutions, we can ensure that no citizen is left behind by economic change."
 SCA_social_rights_charter: "Social Rights Charter"
 SCA_social_rights_charter_desc: "Access to healthcare, education and social security should not be privileges but rights guaranteed to every citizen of the Federation."
 SCA_Invest_in_Education: "Invest in Education"
 SCA_Invest_in_Education_desc: "Educating the young is an investment into the future. By ensuring our educational system is qualitatively superior, we can raise more people into higher paying jobs and thus increase our prosperity to an even greater extend."
 SCA_modernize_Healthcare: "Modernize Healthcare"
 SCA_modernize_Healthcare_desc: "Advances in medicine and an aging population require continued investment in healthcare infrastructure and professional training."
 SCA_The_Nordic_Model: "The Nordic Model"
 SCA_The_Nordic_Model_desc: "Through cooperation between labour, business and government, the Federation has become a model of prosperity, equality and democratic governance admired around the world."
 SCA_liberal_government: "Appoint a Liberal Government"
 SCA_liberal_government_desc: "The Liberal Party has been open about compromising with parties on the left and the right while promoting their agenda of autonomy of the citizen and the nations. It would be wise to appoint them to our government."
 SCA_protect_regional_autonomy: "Protect Regional Autonomy"
 SCA_protect_regional_autonomy_desc: "The Federation exists to serve its constituent states, not replace them. Local democracy and regional self-government remain essential to the Nordic project."
 SCA_The_Nordic_Standard: "The Nordic Standard"
 SCA_The_Nordic_Standard_desc: "Strong institutions, transparent governance and accountable public administration have become hallmarks of the Federation's success."
 SCA_Conservative_government: "Appoint a Conservative Government"
 SCA_Conservative_government_desc: "The Conservative Party and the Christian Democratic Union have proposed a coalition on a conservative platform. In support of morality, the influence of this coalition makes them worth appointing to our government."
 SCA_Strengthen_the_Nordic_Bank: "Strengthen the Nordic Central Bank"
 SCA_Strengthen_the_Nordic_Bank_desc: "Monetary stability and investor confidence are essential foundations for long-term prosperity."
 SCA_strategic_Economy_Investments: "Strategic Economic Investment"
 SCA_strategic_Economy_Investments_desc: "Federal investment programs can support critical industries and strengthen the Federation's economic competitiveness."
 SCA_strengthen_nordic_identity: "Strengthen Nordic Identity"
 SCA_strengthen_nordic_identity_desc: "A successful federation requires more than shared institutions. It requires a shared sense of belonging among its citizens."
 SCA_civic_value_Education: "Civic Values Education"
 SCA_civic_value_Education_desc: "Schools should not merely prepare students for employment, but also cultivate civic responsibility, democratic values and knowledge of our shared Nordic heritage."
 SCA_The_Nordic_Example: "The Nordic Example"
 SCA_The_Nordic_Example_desc: "The Federation has demonstrated that prosperity, social responsibility and democratic government can coexist. Its institutions now serve as an example to nations around the world."

### Army
 SCA_nordic_federal_army: "Establish the Nordic Federal Army"
 SCA_nordic_federal_army_desc: "The Federation cannot have a truly unified defense while its armies remain divided between three national commands. By consolidating the armed forces under a single federal command, we can standardize training and equipment, eliminate unnecessary duplication and create a professional force capable of responding rapidly to threats anywhere in the Nordic Federation."
 SCA_Unify_Command: "Unify the Command Structure"
 SCA_Unify_Command_desc: "The Swedish, Norwegian and Danish armies have developed their own command hierarchies and operational procedures over decades. A federal army cannot function effectively while its senior officers answer to different traditions. By establishing a unified command structure, we can ensure that our forces operate under a common chain of command and are capable of acting as one."
 SCA_Enhance_Capabilities: "Enhancing the Army's Capabilities"
 SCA_Enhance_Capabilities_desc: "A common chain of command is only the beginning. Our soldiers must also train according to common standards, operate the same equipment and follow compatible doctrines. By bringing the three armies together into a genuinely integrated force, we can ensure that every Nordic unit is prepared to fight alongside its comrades from across the Federation."
 SCA_Maintain_national_commands: "Maintain the National Commands"
 SCA_Maintain_national_commands_desc: "The armed forces of Sweden, Norway and Denmark have developed different doctrines and traditions suited to their respective territories and strategic priorities. Rather than dismantling these institutions, we can preserve their national commands within a common federal defense structure, allowing the Federation to draw upon a larger pool of trained personnel while retaining local expertise."
 SCA_stahlberg_combined_arms: "Stahlberg's Combined Arms"
 SCA_stahlberg_combined_arms_desc: "The Swedish general Fredrik Stahlberg has argued that the vast distances of the Federation demand an army capable of moving rapidly between threatened areas and concentrating its strength before the enemy can react. By investing in mechanization and combined-arms warfare, we can turn Scandinavia's distances from a liability into an advantage."
 SCA_Nordic_Trucks: "Motorize our Army"
 SCA_Nordic_Trucks_desc: "The distances of the Nordic Federation place a premium on mobility. By expanding our fleet of military vehicles and motorising more of our formations, we can rapidly move troops and equipment between threatened areas and exploit breakthroughs before the enemy has time to react."
 SCA_gustafsson_deep_strike: "Gustafsson's Deep Strike"
 SCA_gustafsson_deep_strike_desc: "Norway's Erik Gustafsson argues that a Nordic army must be capable of reaching beyond it, disrupting supply lines, headquarters and reserves before they can influence the battle. Concentrated firepower and coordinated operations will allow our relatively small armies to strike where the enemy is weakest."
 SCA_Modernize_arsenal: "Modernize the Arsenal"
 SCA_Modernize_arsenal_desc: "Modern warfare leaves little room for outdated equipment. Our soldiers must be equipped with weapons capable of matching the technological standards of the world's major militaries. By modernising our infantry weapons and artillery, we can increase the effectiveness of our forces while reducing the losses inflicted upon them."
 SCA_nielsen_autonomous_warfare: "Nielsen's Autonomous Warfare"
 SCA_nielsen_autonomous_warfare_desc: "Danish officer Stig Østergaard Nielsen has given his own pitch in favour of trusting our generals to make decisions at the lowest practical level, allowing formations to operate independently when communications are disrupted or circumstances change. Initiative and adaptability will be the foundation of our defense."
 SCA_empower_field_commanders: "Empower Field Commanders"
 SCA_empower_field_commanders_desc: "A vast federation cannot afford to have every decision dictated from a distant headquarters. Our commanders must be trusted to respond to changing circumstances without waiting for instructions from the highest levels of command. By decentralising decision-making and granting greater authority to commanders in the field, our army will become more flexible and resilient."
 SCA_Nordic_armored_forces: "Nordic Armored Forces"
 SCA_Nordic_armored_forces_desc: "The Nordic Federation possesses the industrial capacity to field modern armoured formations, but our constituent armies have traditionally maintained separate approaches to armoured warfare. A unified army gives us the opportunity to standardise our vehicles, training and doctrine and establish a capable Nordic armoured force. With the right investment, our armoured units can provide the mobility and firepower needed to break through enemy positions."
 SCA_Artillery_Investment: "Artillery Investment"
 SCA_Artillery_Investment_desc: "Artillery remains one of the most reliable sources of battlefield firepower. Modern guns, rocket artillery and self-propelled systems can provide sustained support to frontline units while allowing our forces to engage enemy positions from a distance. By investing in modern artillery and expanding our stocks of ammunition, we can give our armies the fire support necessary to prevail on the battlefield."
 SCA_The_Joint_Exercise: "The Joint Exercise"
 SCA_The_Joint_Exercise_desc: "For years, the armed forces of Denmark, Norway and Sweden have trained primarily within their own national structures. That must change if the Federation is to fight as a single military force. A major joint exercise will allow our soldiers, officers and support personnel to train together under realistic conditions, identify weaknesses in our coordination and demonstrate that the Nordic armed forces are ready to operate as one."

### Navy
 SCA_Merge_the_National_Navies: "Merge the National Navies"
 SCA_Merge_the_National_Navies_desc: "The navies of Denmark, Norway and Sweden have each been built around their own national requirements, leaving the Federation with three relatively small fleets operating under separate commands. Individually, none possesses the strength to compete with the major naval powers, but together they form a capable regional force. By bringing our fleets under a unified command, we can eliminate unnecessary duplication and ensure that the combined Nordic Navy operates as a single force."
 SCA_Atlantic_fleet: "Build an Atlantic Fleet"
 SCA_Atlantic_fleet_desc: "The Nordic Federation occupies a strategically important position between the North Atlantic, the Norwegian Sea and the Baltic. If we wish to have a voice beyond our immediate waters, our navy must be capable of operating far from home. By investing in ocean-going vessels and developing the doctrine necessary to employ them, we can establish a fleet capable of protecting Nordic interests across the Atlantic."
 SCA_Develop_ocean_going_destroyers: "Develop Ocean-Going Destroyers"
 SCA_Develop_ocean_going_destroyers_desc: "A sustained presence in the Atlantic requires more than a handful of large warships. Our fleet needs capable escort and surface combatants able to operate far from Nordic waters and support our larger vessels on extended deployments. By investing in modern destroyers and their missile systems, we can give the Federation the screening and striking capability required for an ocean-going fleet."
 SCA_develop_missile_cruisers: "Develop Missile Cruisers"
 SCA_develop_missile_cruisers_desc: "If the Federation is to maintain a credible presence beyond Northern Europe, it must possess surface combatants capable of projecting significant firepower over long distances. Modern missile cruisers can serve as the centrepieces of our task forces, combining command facilities, advanced sensors and powerful missile armament. Developing these ships will give the Nordic Navy the striking power required to operate alongside the world's major fleets."
 SCA_secure_baltic: "Secure the Baltic"
 SCA_secure_baltic_desc: "A Nordic blue-water fleet capable of operating across the Atlantic would require enormous resources, while the Baltic Sea lies directly within our strategic sphere. With the combined fleets of Denmark, Norway and Sweden, the Federation can establish a formidable regional naval force. By concentrating on speed, coastal operations and effective use of the Baltic's confined waters, we can make our navy a decisive force in Northern Europe."
 SCA_expand_coastal_fleet: "Expand the Coastal Fleet"
 SCA_expand_coastal_fleet_desc: "The Baltic's confined waters place a premium on numerous, versatile and economical combat vessels. Corvettes can escort shipping, protect larger warships and hunt submarines while remaining well suited to operations close to our own coastline. By expanding and modernising our light fleet, we can ensure that the Nordic Navy remains effective even against a numerically superior opponent."
 SCA_develop_submarine_warfare: "Develop Submarine Warfare"
 SCA_develop_submarine_warfare_desc: "The Cold War demonstrated the continued value of submarines in threatening naval forces and disrupting maritime supply lines. For a relatively small navy, submarines offer an economical means of imposing significant costs on a larger opponent while operating from the protection of Nordic waters. We should invest in modern submarines and the torpedoes needed to make them an effective instrument of naval warfare."
 SCA_Nordic_Navy: "The Nordic Navy"
 SCA_Nordic_Navy_desc: "The navies of Denmark, Norway and Sweden have now been brought together into a single fighting force. Whether operating in the Atlantic, the Norwegian Sea or the Baltic, the Nordic Navy must be capable of defending our maritime approaches against any power that threatens the Federation. Our naval reforms have given us a common command structure, modern equipment and a doctrine suited to our strategic position. The Nordic Navy shall stand ready to defend our shores and our waters."

### Air
 SCA_Nordic_Air_Authority: "Establish the Nordic Aer Authority"
 SCA_Nordic_Air_Authority_desc: "The Federation's three members have inherited separate systems for managing their airspace and regulating both civilian and military aviation. Before our air forces can be brought together, these systems must be brought under common standards. A Nordic Air Authority will coordinate airspace management, aviation regulations and military requirements throughout the Federation, laying the groundwork for a truly integrated air force."
 SCA_Merge_the_National_Airforces: "Merge the National Air Forces"
 SCA_Merge_the_National_Airforces_desc: "The Federation's three air forces have developed independently, each with its own command structures, procedures and traditions. Individually, they would struggle to withstand the air power of a major adversary, but together they possess the numbers and capabilities necessary to defend the Nordic airspace. With the Nordic Air Authority now established, we can bring our aircraft, personnel and commands together under a unified air force."
 SCA_concentrate_nordic_aerospace: "Concentrate Nordic Aerospace"
 SCA_concentrate_nordic_aerospace_desc: "Corporations such as SAAB have decades of experience developing advanced aircraft and military systems, giving the Federation a most capable aerospace industry. By supporting their expansion throughout the Nordic market, we can concentrate our resources on an established manufacturer, eliminate unnecessary duplication and create the economies of scale necessary to sustain an independent Nordic aerospace industry."
 SCA_Expand_the_Aircraft_Industry: "Expand Nordic Aircraft Production"
 SCA_Expand_the_Aircraft_Industry_desc: "A unified Nordic air force requires an industrial base capable of supplying it with modern aircraft in sufficient numbers. We should expand and modernize aircraft production facilities throughout the Federation, coordinating investment between our existing aerospace industries and ensuring that our air force can be maintained and expanded without relying excessively on foreign suppliers."
 SCA_long_range_strikes: "Develop Long-Range Strike Capabilities"
 SCA_long_range_strikes_desc: "Modern air power gives the Federation the ability to strike targets far beyond the immediate battlefield. Unmanned combat aircraft can provide precise support against tactical targets, while long-range bombers can carry the fight deep into enemy territory. Developing both capabilities will give the Nordic Air Force the means to strike critical targets wherever they are needed."
 SCA_The_Nordic_Airforce: "The Nordic Air Force"
 SCA_The_Nordic_Airforce_desc: "The integration and expansion of our air forces have created a service capable of defending the entire Federation. Our pilots operate under a common command, our industries can supply modern aircraft, and our forces have developed the doctrine and experience necessary to employ them effectively. The Nordic Air Force is now a unified fighting force, ready to defend our skies and support our forces wherever they are needed."

### Economy
 SCA_deepen_federation: "Deepen the Federation"
 SCA_deepen_federation_desc: "The proclamation of the Nordic Federation marked the beginning of our shared journey, but not its conclusion. We must now harmonize our institutions, invest in our regions and foster a common federal identity so that every citizen can share in the Federation's prosperity."
 SCA_modernize_nordic_infrastructure: "Modernize Nordic Infrastructure"
 SCA_modernize_nordic_infrastructure_desc: "The formation of the Federation has brought new attention to the infrastructure connecting our constituent states. Roads, railways and bridges built for a collection of separate nations must now serve a single economy. We should invest in our transport network in order to bring our regions closer together."
 SCA_develop_nordic_ports: "Develop the Nordic Ports"
 SCA_develop_nordic_ports_desc: "Our Federation is surrounded by the sea, and its prosperity has always depended upon maritime trade. Expanding our ports and modernizing their facilities, will increase strengthen connections between our coastal regions and provide the Federation with the logistical capacity necessary to support its navy when called upon."
 SCA_develop_nordic_resources: "Develop Nordic Resources"
 SCA_develop_nordic_resources_desc: "The Nordic countries possess considerable reserves of energy and mineral resources, but their exploitation has historically been planned along national lines. Investment and extraction technology across the Federation will make better use of the resources beneath our soil."
 SCA_modernize_nordic_agriculture: "Modernize Nordic Agriculture"
 SCA_modernize_nordic_agriculture_desc: "Nordic agriculture has become highly productive, but increasing international competition and changing consumer demands present new challenges for our farmers. A coordinated agricultural policy is vital in order to secure a productive domestic agricultural sector."
 SCA_foster_nordic_enterprise: "Foster Nordic Enterprise"
 SCA_foster_nordic_enterprise_desc: "The Nordic economies have long benefited from innovative and competitive private enterprises. Removing the last of the barriers between our markets will create a truly Nordic business community capable of competing on the world stage."
 SCA_Unite_Intelligence_Agencies: "Unite Intelligence Agencies"
 SCA_Unite_Intelligence_Agencies_desc: "Sweden, Norway and Denmark have spent decades maintaining separate intelligence services and security institutions. Bringing them together under federal authority will eliminate duplication, improve the sharing of information and give the Federation a unified understanding of the threats facing it."
 SCA_Unified_Schooling_System: "Unify the Schooling System"
 SCA_Unified_Schooling_System_desc: "Education remains largely a matter for the constituent states, leaving Nordic schools with different curricula, standards and qualifications. Establishing common federal standards will make it easier for students and professionals to move throughout the Federation and give future generations a stronger shared foundation."
 SCA_promote_nordic_language_education: "Promote Nordic Language Education"
 SCA_promote_nordic_language_education_desc: "Although the Scandinavian languages share much of their vocabulary and history, differences in pronunciation and usage can still cause misunderstandings between our citizens. Encouraging the teaching of the major Nordic languages will make communication easier and strengthen the cultural ties between the peoples of the Federation."
 SCA_Federal_Exchange_Programs: "Federal Exchange Programmes"
 SCA_Federal_Exchange_Programs_desc: "Shared institutions and common languages can only take us so far. By encouraging students to study in other parts of the Federation, we can build friendships and connections that cross old national boundaries and create a generation that thinks of itself as Nordic as well as Swedish, Norwegian or Danish."
 SCA_stronger_together: "Stronger Together!"
 SCA_stronger_together_desc: "Decades of political and economic integration have demonstrated what the Nordic countries can accomplish when they work together. Our citizens remain proud of their individual national identities, but increasingly recognize that the interests of Denmark, Norway and Sweden are best served through cooperation and unity.\n\nThe Federation has shown that our nations need not surrender their distinct traditions to share a common future. United, the Nordic peoples possess a voice and strength that none of our countries could achieve alone."

### Events ###
 NVGC_scandinavia_formation_events.1.t: "Militarize the Nordic Council?"
 NVGC_scandinavia_formation_events.1.d: "Representatives and diplomats of all three major Scandinavian countries have gathered in [SCA_nordic_council_leader.Capital.GetCapitalVictoryPointName] for a treaty to kickstart closer cooperation between the Nordic countries. We share values that not everyone in the world shares with us, and against a hostile world the nations of Scandinavia ought to work together, they argue. No hard agreements have been set here, but it does look like the follow-ups to this gathering might be more instrumental."
 NVGC_scandinavia_formation_events.1.a: "A toast to our brethren!"

 NVGC_scandinavia_formation_events.2.t: "The Treaty of [SCA_nordic_council_leader.Capital.GetCapitalVictoryPointName]"
 NVGC_scandinavia_formation_events.2.d: "We have invited diplomats and representatives from both [SCA_loc_formation_countries] to [SCA_nordic_council_leader.Capital.GetCapitalVictoryPointName] to negotiate a - for now non-binding - treaty to kickstart closer cooperation between the Nordic countries. We share value that not everyone in the world shares with us, and against a hostile world the nations of Scandinavia ought to work together!\n\nWhile indeed few hard agreements will be set here, the first impressions are positive, and it seems the follow-ups to this gathering might be more instrumental."
 NVGC_scandinavia_formation_events.2.a: "A toast to our brethren!"
 NVGC_scandinavia_formation_events.2.b: "This is a waste of time."
 SCA_formation_SWE: "Norway and Denmark"
 SCA_formation_NOR: "Sweden and Denmark"
 SCA_formation_DEN: "Sweden and Norway"

 NVGC_scandinavia_formation_events.3.t: "[From.GetNameDefCap] Rejects Our Proposal"
 NVGC_scandinavia_formation_events.3.d: "[From.GetNameDefCap] has let us know that they don't see any gain in following through with the reform we proposed. It seems that, in this area of politics at least, the peak of Scandinavian cooperation has been reached."
 NVGC_scandinavia_formation_events.3.a: "Disappointing, but so be it..."

 NVGC_scandinavia_formation_events.13.t: "[SCA_federation_initiator.GetNameDefCap] Proposes a Nordic Federation"
 NVGC_scandinavia_formation_events.13.d: "[SCA_federation_initiator.GetNameDefCap] has proposed to unite all the Scandinavian countries in a democratic federation. This would result in the integration of our country into the Nordic Federation."
 NVGC_scandinavia_formation_events.13.a: "Agree to federate."
 NVGC_scandinavia_formation_events.13.b: "Oppose this project."

 scandinavia_formation_events.14.t: "[From.GetNameDefCap] Accepts Our Proposal"
 scandinavia_formation_events.14.d: "[From.GetNameDefCap] has expressed interest to join our proposal to unite all the Scandinavian countries in a democratic federation. We are one step closer to the establishment of a united Scandinavia."
 scandinavia_formation_events.14.a: "That's good!"

 NVGC_scandinavia_formation_events.15.t: "[From.GetNameDefCap] Rejects Our Proposal"
 NVGC_scandinavia_formation_events.15.d: "[From.GetNameDefCap] has waved off our proposal to unite all the Scandinavian countries in a democratic federation. It seems Scandinavian integration has, by all means, reached its peak."
 NVGC_scandinavia_formation_events.15.a: "Disappointing, but not entirely unexpected..."

 NVGC_scandinavia_formation_events.16.t: "Creation of the Nordic Federation"
 NVGC_scandinavia_formation_events.16.d: "The other Scandinavian countries have agreed to our proposal regarding federation. According to its constitution, the Nordic Federation will, for now until it can be addressed by a proper federal government of course, be a democratic, federal monarchy. The executive will consists of a federal government, which holds power on behalf of a council consisting of the Swedish, Norwegian and Danish monarchs. The federal parliament will be based in Göteborg, but all the constituent kingdoms retains their individual institutions and autonomy."
 NVGC_scandinavia_formation_events.16.a: "Great!"

 NVGC_scandinavia_formation_events.17.t: "The Nordic Federation Proclaimed"
 NVGC_scandinavia_formation_events.17.d: "In a move few observers believed possible only a decade ago, Sweden, Norway, and Denmark have formally agreed to dissolve portions of their national sovereignty and unite under a new federal government: the Nordic Federation.\n\nEmerging from years of expanding military, economic, and political coordination, the new federation is intended to strengthen the Nordic countries' influence in an increasingly uncertain world. Supporters of the union have described it as the natural culmination of decades of Nordic cooperation, while critics warn that the project may strain democratic institutions and national identities alike.\n\nCelebrations have erupted across much of Scandinavia as officials gather for the inaugural federal parliamentary session. Though questions remain about the long-term future of the federation, there is little doubt that the political landscape of Northern Europe has changed dramatically overnight."
 NVGC_scandinavia_formation_events.17.a: "A new chapter for the North begins."

 NVGC_scandinavia_events.1.t: "The Formation of the Nordic Federation"
 NVGC_scandinavia_events.1.d: "Following the proclamation of the Nordic Federation, a provisional federal administration has been established to oversee the transition from intergovernmental cooperation to federal governance. While the governments of Sweden, Norway and Denmark continue to exercise most day-to-day authority, preparations are now underway for a Constitutional Convention tasked with drafting the Federation's highest law.\n\nOnce ratified, the federal constitution will define the relationship between the federal government and the constituent states, establish the framework for federal elections, and determine the future character of the Nordic project itself.\n\nThe eyes of the North now turn toward the delegates who will shape the Federation's future."
 NVGC_scandinavia_events.1.a: "Prepare the Constitutional Convention!"

 scandinavia_events.2.t: "The First Federal Election"
 scandinavia_events.2.d: "We are ready to conduct our first federal election. This parliament is provisional and will only last until we can elect a more permanent assembly at a later date. While there are several smaller parties on the ballot, there are three that can realistically win the election. The Nordic Social Democratic Worker's Party is campaigning on the issue of public welfare and would like to keep the status quo in regards to federal and international affairs. The Liberal Party is promising to cut taxes and make itself strong for the civil liberties of the citizens. They are also in favour of maintaining the current status of the federation. Lastly, the Farmer's League is an agrarian party coming up for the interests of Scandinavia's farmers. Who will win?"
 scandinavia_events.2.a: "NSAP - The Social Democrats"
 scandinavia_events.2.b: "LP - The Liberals"
 scandinavia_events.2.c: "The Farmer's League - The Social Conservatives"

 scandinavia_events.3.t: "The [GetYear] Federal Election"
 scandinavia_events.3.d: "The time has come to elect a federal parliament to serve for a full four year term. Once again the different parties have campaigned vigorously, and it is to the Nordic people to decide who reigns supreme in the end."

 NVGC_scandinavia_events.4.t: "The Constitutional Convention"
 NVGC_scandinavia_events.4.d: "Delegates from across the Nordic Federation have assembled to draft the constitution that will govern the new state. While broad agreement exists on democracy, federalism and the rule of law, major questions remain unresolved.\n\nHow much authority should be vested in the federal government? What powers should remain with the constituent states? How should the institutions of the Federation be structured?\n\nThe answers to these questions will shape the future of the Nordic project for generations to come."
 NVGC_scandinavia_events.4.a: "Let the debates begin!"

 NVGC_scandinavia_events.5.t: "The Crown Question"
 NVGC_scandinavia_events.5.d: "The Federation contains three sovereign monarchies, each with centuries of history and legitimacy behind them. After many debates, the delegates have come to the consensus of establishing a Council of Monarchs that would collectively exercise the ceremonial powers of the head of state."
 NVGC_scandinavia_events.5.a: "A fair deal"

 NVGC_scandinavia_events.7.t: "The Legislative Question"
 NVGC_scandinavia_events.7.d: "One of the most contentious issues before the Convention concerns the federal legislature. Some delegates argue that the Federation requires a dedicated parliament elected specifically to represent Nordic citizens at the federal level. Others contend that the existing national legislatures already possess democratic legitimacy and that joint parliamentary sessions would provide a simpler and more accountable solution.\n\nBoth proposals enjoy considerable support, and neither side appears willing to concede easily."
 NVGC_scandinavia_events.7.a: "Create a Nordic Parliament"
 NVGC_scandinavia_events.7.b: "Continue the Joint Sessions"

 NVGC_scandinavia_events.9.t: "The Judicial Question"
 NVGC_scandinavia_events.9.d: "As work on the Constitution nears completion, the Convention remains divided over the role of the judiciary.\n\nSome delegates wish to preserve substantial judicial autonomy for the constituent states. Others advocate the creation of a federal institution capable of reviewing legislation and ensuring the uniform application of constitutional law throughout the Federation."
 NVGC_scandinavia_events.9.a: "Preserve Judicial Autonomy"
 NVGC_scandinavia_events.9.b: "Establish a Nordic High Council"
 NVGC_scandinavia_events.9.c: "Create a Federal Judiciary"

 NVGC_scandinavia_events.12.t: "The Nordic Social Democratic Alliance"
 NVGC_scandinavia_events.12.d: "Representatives of the major social democratic parties of Sweden, Norway and Denmark have gathered to announce the formation of the Nordic Social Democratic Party. Drawing upon decades of cooperation between the Nordic labour movements, the new party seeks to combine social justice, economic prosperity and democratic governance on a federal scale."
 NVGC_scandinavia_events.12.a: "As to be expected"

 NVGC_scandinavia_events.13.t: "A Nordic Conservative Coalition"
 NVGC_scandinavia_events.13.d: "Several centre-right parties from across the Federation have agreed to merge into a single Conservative Party ahead of the first federal elections. Advocating fiscal responsibility, national security and gradual reform, the party hopes to provide a stable alternative to the social democrats."
 NVGC_scandinavia_events.13.a: "We wish them luck."

 NVGC_scandinavia_events.14.t: "The Liberal Alternative"
 NVGC_scandinavia_events.14.d: "Liberal politicians from throughout the Federation have announced the creation of the Liberal Party. Emphasising civil liberties, constitutional government and international cooperation, the party seeks to establish itself as a centrist alternative between the larger social democratic and conservative blocs."
 NVGC_scandinavia_events.14.a: "We'll see how this pans out."

 NVGC_scandinavia_events.15.t: "The Nordic Left Movement"
 NVGC_scandinavia_events.15.d: "Socialist, democratic socialist and environmentalist organisations from across the Federation have united to form the Nordic Left Alliance. While differing on many issues, its members share a commitment to reducing economic inequality, challenging corporate influence and expanding democratic participation."
 NVGC_scandinavia_events.15.a: "Can such a broad coalition work together?"

 NVGC_scandinavia_events.16.t: "The Nordic Constitution Ratified"
 NVGC_scandinavia_events.16.d: "After months of debate, compromise and negotiation, the Constitutional Convention has completed its work. The Nordic Constitution has now been ratified and will enter into force immediately.\n\nThough not every delegate achieved everything they desired, the document establishes the institutions that shall govern the Federation and defines the relationship between its citizens, its constituent states and its federal government."
 NVGC_scandinavia_events.16.a: "Hurrah!"

 scandinavia_events.17.t: "Switching of the Guard"
 scandinavia_events.17.d: "As the constitution provides, the chairman of the federation revolves between the monarchs of the constituent member states. 2 years have passed, and it is time for the next monarch to take this role upon themselves."
 scandinavia_events.17.a: "Hurrah!"

 NVGC_scandinavia_events.18.t: "A Christian Democratic Union"
 NVGC_scandinavia_events.18.d: "Christian democratic parties from across the Federation have agreed to contest the upcoming federal elections under a common banner. The newly founded Christian Democratic Union advocates social responsibility, strong communities and the preservation of the ethical and cultural traditions that have shaped Nordic society."
 NVGC_scandinavia_events.18.a: "Will Christians rally behind them?"

 NVGC_scandinavia_events.19.t: "The Formation of the Nordic Federation"
 NVGC_scandinavia_events.19.d: "Delegates from Sweden, Norway and Denmark convened this morning in Stockholm to finalise a resolution for the federalisation of the three countries into one entity. Known now as the Nordic Federation, many political analysts have been debating what this will mean for the future of the balance of power in Europe. While some believe that the liberal ideas of the federation align with the interests of the Entente, most agree that the new nation will likely take a stance of neutrality on all matters. The balance of power once again shifts on the world stage."
 NVGC_scandinavia_events.19.a: "The Northern Lights Shine Bright"

 NVGC_scandinavia_events.20.t: "The Nordic Federation Negotiates for Neutrality"
 NVGC_scandinavia_events.20.d: "With the formation of the Nordic Federation, it seems the Scandivanians have decided to reject military alignment. They have approached us to negotiate a recognition of their neutrality, however, with two of their constituent nations having previously been in our military sphere. We could push for them to continue intelligence cooperation with us in exchange for neutrality."
 NVGC_scandinavia_events.20.a: "Demand they continue intelligence cooperation, then they shall have their peace."

 NVGC_scandinavia_events.21.t: "The American Response."
 NVGC_scandinavia_events.21.d: "The Americans have responded to our request. If we continue intelligence cooperation, then they will agree to respect our neutrality."
 NVGC_scandinavia_events.21.a: "Now to talk with the Russians."

 NVGC_scandinavia_events.22.t: "The Nordic Federation Negotiates for Neutrality."
 NVGC_scandinavia_events.22.d: "With the formation of the Nordic Federation, it created the problem of a unified Scandinavia possibly joining NATO. However, the Nordic Federation has started talks with us to ensure they avoid any bloodshed. While they are forced to continue intelligence cooperation with the Americans, we can demand that they oppose any further American encroachment into their affairs. We will also give a promise of protection from other powers that they can invoke any time."
 NVGC_scandinavia_events.22.a: "A great opportunity for us"

 NVGC_scandinavia_events.23.t: "The Russian Response."
 NVGC_scandinavia_events.23.d: "The Russians responded rather well to our negotiations, however their terms make it clear that we are to avoid any further terms with America and to oppose any invasion or perceived interference in our affairs by other powers, with Russia promising aid if we wish it. This makes it clear that the Russians see us in their sphere and we may need to tread a fine line between them and America."
 NVGC_scandinavia_events.23.a: "A fair price for peace."

 NVGC_scandinavia_events.24.t: "Our Neutrality Secured"
 NVGC_scandinavia_events.24.d: "With both the Americans and the Russians having agreed to respect our neutrality, given we act in accordance with their conditions, we can now finalize all agreements with them and declare ourselves a neutral state."
 NVGC_scandinavia_events.24.a: "A great day for peace!"
### Characters ###
 SCA_federal_council: "Federal Council"
 SCA_federal_council_leader_desc: "§YBackground:§! §LThe Federal Council of the Nordic Federation is the federal head of state. The council, which consists of the monarchs of the constituent states, is mostly a symbolic institution as it is bound to follow the advice of the federal government.§!"
 scandinavia_events.21.t: "The German Response."
 scandinavia_events.21.d: "The German's have responded to our request. If we join their economic sphere like Sweden and Denmark had, then they will agree to respect our neutrality."
 scandinavia_events.21.a: "Well that's not so bad is it?"

 scandinavia_events.22.t: "The Nordic Federation Negotiates for Neutrality."
 scandinavia_events.22.d: "With the formation of the Nordic Federation, it created the problem of a unified Scandinavia possibly joining the Reichspakt. However, the Nordic Federation has started talks with us to ensure they avoid any bloodshed. While they are forced back into the German's economic sphere, we can demand that they oppose any further German encroachment into their affairs. We will also give a promise of protection from other powers that they can invoke any time."
 scandinavia_events.22.a: "A great opportunity for us"

 scandinavia_events.23.t: "The Russian Response."
 scandinavia_events.23.d: "The Russians responded rather well to our negotiations, however their terms make it clear that we are to avoid any further terms with Germany and to oppose any invasion or perceived interference in our affairs by other powers, with Russia promising aid if we wish it. This makes it clear that the Russians see us in their sphere and we may need to tread a fine line between them and Germany."
 scandinavia_events.23.a: "The cause requires sacrifice..."

 scandinavia_events.24.t: "The Nordic Federation Negotiates for Neutrality."
 scandinavia_events.24.d: "The newly formed Nordic Federation have approached us for talks about their neutrality in European affairs. They could have been a formidable enemy on Germany's side but they have chosen to protect their own people instead. We can push them to allow for socialist parties and syndicalist unions to operate freely in exchange for recognising their neutrality."
 scandinavia_events.24.a: "Open socialist parties will further socialism anyway."

 scandinavia_events.25.t: "The Socialist Response."
 scandinavia_events.25.d: "The Third Internationale have agreed to our request for neutrality on two conditions: First is that any socialist political party that wishes to organise and contest elections should be free to do so, and second, that syndicalist unions can freely operate in workplaces. These terms seem quite reasonable and a few new political groups are a small price to pay to secure neutrality."
 scandinavia_events.25.a: "Hopefully they aren't the revolutionary kind..."

### Characters ###
 SCA_federal_council: "Federal Council"
 SCA_federal_council_leader_desc: "§YBackground:§! §LThe Federal Council of the Nordic Federation is the federal head of state. The council, which consists of the monarchs of the constituent states, is mostly a symbolic institution as it is bound to follow the advice of the federal government.§!"
