 SCA_develop_stockholm: "Develop [141.GetCapitalVictoryPointName]"
 SCA_develop_stockholm_desc: "With the progress made so far in the first stage of the §CNordic Economic & Development Plan§!, [141.GetCapitalVictoryPointName] is now ready for development."
 SCA_develop_oslo: "Develop [110.GetCapitalVictoryPointName]"
 SCA_develop_oslo_desc: "With the progress made so far in the first stage of the §CNordic Economic & Development Plan§!, [110.GetCapitalVictoryPointName] is now ready for development."
 SCA_develop_copenhagen: "Develop [37.GetCapitalVictoryPointName]"
 SCA_develop_copenhagen_desc: "With the progress made so far in the first stage of the §CNordic Economic & Development Plan§!, [37.GetCapitalVictoryPointName] is now ready for development."
 SCA_develop_helsinki: "Develop [111.GetCapitalVictoryPointName]"
 SCA_develop_helsinki_desc: "With the progress made so far in the first stage of the §CNordic Economic & Development Plan§!, [111.GetCapitalVictoryPointName] is now ready for development."
 SCA_develop_gothenburg: "Develop [140.GetCapitalVictoryPointName]"
 SCA_develop_gothenburg_desc: "With the progress made so far in the first stage of the §CNordic Economic & Development Plan§!, [140.GetCapitalVictoryPointName] as the capital of the Nordic Federation must be developed into a shining beacon of the north."
 SCA_develop_reykjavik: "Continue the Development of [100.GetCapitalVictoryPointName]"
 SCA_develop_reykjavik_desc: "Iceland while an equal member of our brotherly union still lags far behind the other member states. By developing [100.GetCapitalVictoryPointName] we shall create a more perfect union."
 SCA_build_norway: "Expand Norwegian Dockyards"
 SCA_build_norway_desc: "By expanding Norway's maritime industry the Nordic Federation will be able to dominate the global trade through a vast merchant marine."
 SCA_build_sweden: "Expand Domestic Swedish Industries"
 SCA_build_sweden_desc: "Sweden is without question the backbone of our industrial economy. By increasing the regions already hardy industrial base the prosperity of the peoples of the Federation will improve."
 SCA_build_denmark: "Expand Danish Arms Industries"
 SCA_build_denmark_desc: "Denmark, while not as advanced in arms production as Sweden, has a near perfect location for the expansion of its trade. Denmark's position next to the German behemoth and its access to the Baltic and North Seas means that the expansion of her military industry will both improve our domestic defence and national prosperity."
 SCA_build_iceland: "Continue the Development of [100.GetName]"
 SCA_build_iceland_desc: "Iceland continues despite countless investments to lag behind the other members of the Federation. With one final push to the nation it shall become a true equal to the others states of our union."
 SCA_build_finland: "Expand Finnish Military Production"
 SCA_build_finland_desc: "Finland is in a precarious position, under constant threat from the insidious Russians, expanding the defensive capacity of Finland has become a top priority for the Federation. Together we stand as brothers."
 SCA_developed_states: "§CNordic Economic Development Level§!"

 SCA_road_decisions: "Expand the Road Network"
 SCA_road_decisions: "We should invest in our transport and infrastructure network in order to bring our regions closer together."
 SCA_gothenburg_to_oslo_road: "Göteborg to Oslo Highway"
 SCA_gothenburg_to_stockholm_road: "Göteborg to Stockholm Highway"
 SCA_expand_the_oresund_bridge: "Expand the Øresund Bridge"
 SCA_road_to_german_border: "Modernise the Highway Connection with Europe"
 SCA_connect_finland_roads: "Expand the Finnish Highway Network"

 SCA_join_scandinavian_research: "Join the Scandinavian Scientist Conference"
 SCA_join_scandinavian_research_desc: "Our Nordic allies have created the Scandinavian Scientist Conference, a joint research initiative with the objective of facilitating the exchange of technology between members of the [FROM.GetFactionName]. As a member of the latter, it's time we strengthen our partnership by joining the Scandinavian Scientist Conference as well."
